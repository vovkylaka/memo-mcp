services:
  - type: web
    name: memo-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: OWNER_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: memo-mcp-db
          property: connectionString

databases:
  - name: memo-mcp-db
    plan: free
    databaseName: memo
